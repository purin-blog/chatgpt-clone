name: Docker Image CI

on:
push:
branches: [ "main" ]
tags:
- 'v*'
pull_request:
branches: [ "main" ]

jobs:
build:
runs-on: ubuntu-latest
permissions:
contents: write

steps:
- uses: actions/checkout@v4

- name: Build the Docker image
run: docker build . --file Dockerfile --tag chatgpt-clone:latest

- name: Save Docker image
run: docker save chatgpt-clone:latest | gzip > chatgpt-clone.tar.gz

- name: Upload artifact
uses: actions/upload-artifact@v4
with:
name: chatgpt-clone
path: chatgpt-clone.tar.gz
compression-level: 0

- name: Upload to Release
if: startsWith(github.ref, 'refs/tags/')
uses: softprops/action-gh-release@v1
with:
files: chatgpt-clone.tar.gz
env:
GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
